name: company-backend

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV}
  LOG_LEVEL: ${LOG_LEVEL}
  API_PUBLIC_ORIGIN: ${API_PUBLIC_ORIGIN}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS}
  COOKIE_SECURE: ${COOKIE_SECURE}
  DB_HOST: ${DB_HOST}
  DB_PORT: ${DB_PORT}
  DB_NAME: ${DB_NAME}
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_SSLMODE: ${DB_SSLMODE}
  REDIS_RATE_LIMIT_URL: ${REDIS_RATE_LIMIT_URL}
  RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET}
  CURSOR_SIGNING_KEY: ${CURSOR_SIGNING_KEY}
  ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED}
  DEMO_PASSWORD: ${DEMO_PASSWORD}
  DOCS_ENABLED: ${DOCS_ENABLED}
  METRICS_ENABLED: ${METRICS_ENABLED}

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
  redis:
    image: redis:8.10.2
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1000", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
  migrate:
    build: .
    image: company-backend-api:local
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-environment
      DB_USER: ${DB_MIGRATION_USER}
      DB_PASSWORD: ${DB_MIGRATION_PASSWORD}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
  api:
    build: .
    image: company-backend-api:local
    environment: *app-environment
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
