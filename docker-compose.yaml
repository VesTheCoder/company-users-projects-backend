name: company-backend

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  API_PUBLIC_ORIGIN: ${API_PUBLIC_ORIGIN:-http://localhost:8080}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-[]}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-["localhost","127.0.0.1"]}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:?required}
  DB_SSLMODE: ${DB_SSLMODE:-disable}
  REDIS_RATE_LIMIT_URL: redis://redis:6379/0
  RATE_LIMIT_KEY_SECRET: ${RATE_LIMIT_KEY_SECRET:?required}
  CURSOR_SIGNING_KEY: ${CURSOR_SIGNING_KEY:?required}
  ALLOW_DEMO_SEED: ${ALLOW_DEMO_SEED:-false}
  DOCS_ENABLED: ${DOCS_ENABLED:-true}
  METRICS_ENABLED: ${METRICS_ENABLED:-true}

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?required}
      POSTGRES_DB: ${DB_NAME:?required}
      DB_USER: ${DB_USER:?required}
      DB_PASSWORD: ${DB_PASSWORD:?required}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:?required}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?required}
    command: ["postgres", "-c", "max_connections=100"]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  redis:
    image: redis:8.10.2
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "60", "1000", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  migrate:
    build: .
    image: company-backend-api:local
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-environment
      DB_USER: ${DB_MIGRATION_USER:?required}
      DB_PASSWORD: ${DB_MIGRATION_PASSWORD:?required}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:?required}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?required}
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp]
  api:
    build: .
    image: company-backend-api:local
    environment:
      <<: *app-environment
      DB_USER: ${DB_USER:?required}
      DB_PASSWORD: ${DB_PASSWORD:?required}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
